<noscript><p style="padding:20px">Kanz nécessite JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
<script>
// Diagnostic : si l'application ne démarre pas (fichiers manquants sur l'hébergement), on liste ce qui manque.
setTimeout(async () => {
  if (document.body.classList.contains('ready')) return;
  const files = ['css/app.css', 'js/app.js', 'js/store.js', 'js/ui/icons.js', 'icons/icon-192.png', 'manifest.webmanifest'];
  const bad = [];
  for (const f of files) { try { const r = await fetch(f, { cache: 'no-store' }); if (!r.ok) bad.push(f); } catch { bad.push(f); } }
  const box = document.createElement('div');
  box.style.cssText = 'font:15px system-ui;padding:20px;margin:20px;border-radius:14px;background:#fdecea;color:#7a1f16';
  box.textContent = bad.length ? 'Kanz ne démarre pas : fichiers introuvables → ' + bad.join(', ') + '. Importez tout le dossier (css, js, icons) à la racine du site.' : 'Kanz ne démarre pas : ouvrez la console du navigateur pour voir l’erreur.';
  document.body.prepend(box);
}, 4000);
</script>
